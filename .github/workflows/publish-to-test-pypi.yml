name: Publish Python distribution to TestPyPI

on: workflow_dispatch

jobs:
  build_wheels:
    name: Build wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
        CIBW_CONFIG_SETTINGS: '"cmake.define.NCTRL_FIXED_SIZES=OFF" "cmake.define.DIM_FIXED_SIZES=OFF"'
        CIBW_BEFORE_ALL_MACOS: |
          if [ "$(uname -m)" = "arm64" ]; then
            URL="https://anaconda.org/conda-forge/llvm-openmp/11.1.0/download/osx-arm64/llvm-openmp-11.1.0-hf3c4609_1.tar.bz2"
          else
            URL="https://anaconda.org/conda-forge/llvm-openmp/11.1.0/download/osx-64/llvm-openmp-11.1.0-hda6cdc1_1.tar.bz2"
          fi
          curl -L -o /tmp/libomp.tar.bz2 "$URL"
          mkdir -p "$HOME/libomp"
          tar -xjf /tmp/libomp.tar.bz2 -C "$HOME/libomp"
        CIBW_ENVIRONMENT_MACOS: OpenMP_ROOT=$HOME/libomp LDFLAGS="-Wl,-rpath,$HOME/libomp/lib"
        CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
        CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair -w {dest_dir} -v {wheel}
        CIBW_TEST_REQUIRES: pytest toml pyyaml scipy numpy
        CIBW_TEST_COMMAND: pytest {project}/tests --ignore={project}/tests/test_build.py
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"
    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel==3.2.1
    - name: Build wheels
      run: python -m cibuildwheel --output-dir dist
    - uses: actions/upload-artifact@v7
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: dist/*.whl

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user

    - name: Build a binary wheel and a source tarball
      run: >-
        python3 -m
        build -s
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

    - uses: actions/upload-artifact@v7
      with:
        name: cibw-sdist
        path: dist/*.tar.gz

  publish-to-testpypi:
    name: Publish Python distribution to TestPyPI
    needs:
    - build_wheels
    - make_sdist
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/Py-STE

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        pattern: cibw-*
        path: dist/
        merge-multiple: true

    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
        verbose: true
