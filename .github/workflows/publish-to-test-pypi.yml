name: Publish Python distribution to TestPyPI

on: workflow_dispatch

jobs:
  build_wheels:
    name: Build wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
        CIBW_CONFIG_SETTINGS: '"cmake.define.NCTRL_FIXED_SIZES=OFF" "cmake.define.DIM_FIXED_SIZES=OFF"'
        # NumPy has never published a win_arm64 wheel below cp311, so these
        #   wheels could not be installed by anyone.
        CIBW_SKIP: cp38-win_arm64 cp39-win_arm64 cp310-win_arm64
        CIBW_BEFORE_ALL_MACOS: |
          if [ "$(uname -m)" = "arm64" ]; then
            URL="https://anaconda.org/conda-forge/llvm-openmp/20.1.1/download/osx-arm64/llvm-openmp-20.1.1-hdb05f8b_1.conda"
          else
            URL="https://anaconda.org/conda-forge/llvm-openmp/20.1.1/download/osx-64/llvm-openmp-20.1.1-ha54dae1_1.conda"
          fi
          curl -L -o /tmp/libomp.conda "$URL"
          rm -rf /tmp/libomp-pkg
          mkdir -p /tmp/libomp-pkg "$HOME/libomp"
          unzip -q -o /tmp/libomp.conda -d /tmp/libomp-pkg
          tar -xf /tmp/libomp-pkg/pkg-*.tar.zst -C "$HOME/libomp"
          install_name_tool -id "$HOME/libomp/lib/libomp.dylib" "$HOME/libomp/lib/libomp.dylib"
          codesign -s - -f "$HOME/libomp/lib/libomp.dylib"
        CIBW_ENVIRONMENT_MACOS: OpenMP_ROOT=$HOME/libomp MACOSX_DEPLOYMENT_TARGET=${{ matrix.os == 'macos-15-intel' && '10.13' || '11.0' }}
        CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
        CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair -w {dest_dir} -v {wheel}
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: pytest {project}/tests/test_multithreading.py
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"
    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel==3.2.1
    - name: Build wheels
      run: python -m cibuildwheel --output-dir dist
    - uses: actions/upload-artifact@v7
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: dist/*.whl

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user

    - name: Build a binary wheel and a source tarball
      run: >-
        python3 -m
        build -s
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

    - uses: actions/upload-artifact@v7
      with:
        name: cibw-sdist
        path: dist/*.tar.gz

  publish-to-testpypi:
    name: Publish Python distribution to TestPyPI
    needs:
    - build_wheels
    - make_sdist
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/Py-STE

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        pattern: cibw-*
        path: dist/
        merge-multiple: true

    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
        verbose: true
